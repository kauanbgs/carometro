# Define os serviços que compõem a aplicação (app e db)
services:
  app:
    build: . # O "." indica qual imagem Docker será construída no diretório atual
    command: /bin/sh -c "npm install && npx knex migrate:latest && npx knex seed:run && npx nodemon src/server.js" 
    # o Nodemon vai reiniciar o container quando houver mudanças no código
    ports:
      - "5000:5000" # Mapeia a porta do container para a máquina
    volumes:
      - .:/usr/app # Monta o diretório atual da máquina (Host/Física) para o diretório /usr/app dentro do container
    depends_on: # Indica de o App depende de DB
      - db

  db:
    image: mysql:8.0
    restart: always # Configura o container para reiniciar automaticamente caso ele pare
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigo
    ports:
      - "3307:3306" # Mapeia a porta 3306 do container para a 3306 da máquina
    volumes:
      - db_data:/var/lib/mysql
      # Roda os arquivos SQL existentes dentro da pasta mysql-init na inicialização do container MYSQL

volumes:
  db_data: # Definindo um volume nomeado para persisitir os dados do banco de dados
